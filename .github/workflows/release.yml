name: Compilar app de escritorio

# Compila instaladores para Windows (.exe), Linux (AppImage/.deb) y macOS (.dmg).
# - En cada etiqueta vX.Y.Z publica una Release de GitHub con los instaladores.
# - También se puede lanzar a mano desde la pestaña Actions indicando la versión (p. ej. v1.0.0):
#   crea la etiqueta y la Release automáticamente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. v1.0.0). Vacío = sólo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar instaladores
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: AstroTPV-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ inputs.version || github.ref_name }}
          name: AstroTPV ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
