name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (unitarios + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar sintaxis
        run: for f in js/*.js js/views/*.js sw.js electron/*.js scripts/*.js; do node --check "$f"; done
      - name: Tests unitarios
        run: npm test
      - name: Instalar Playwright + Chromium
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Test E2E (venta, mesas, stock, devolución, cierre Z, modo offline)
        run: npm run test:e2e
      - name: Construir web
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: astrotpv-web
          path: dist
